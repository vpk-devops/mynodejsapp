version: 0.0
os: linux

files:
  - source: .
    destination: /home/ec2-user/tinyapp # Change this path as needed

hooks:
  AfterInstall:
    - location: scripts/install_depends.sh
      timeout: 300
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start_server.sh
      runas: ec2-user